# Jackal J100 / ROS 2 Jazzy: indoor RPP comparison candidate, 2026-10-14.
# Full YAML; replace the active nav2_low_speed.yaml only after backing it up.
# Based on indoor_turn_control: retain Shim, checker types, footprints,
# inflation, recovery BTs, collision monitor and common velocity/acceleration bounds.
# After successful RPP run 114801: tighten XY goal tolerance from 0.25 to 0.10 m.
# Replace MPPI with Regulated Pure Pursuit; scale smoother acceleration deltas.
# RPP desired forward speed 0.06 m/s is NOT the common/recovery speed limit.
# RPP has no MPPI wz_max parameter; shared smoother yaw bound remains +/-0.10.
# Geometry/curvature settings are a trial, not validated physical performance.
# Requires Nav2 restart; changing the plugin parameter live does not load RPP.
# See Docs/Jackal_RPP_Trial_2026-10-14.md for deployment, readback and rollback.
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /home/robot/jackal_nav2/behavior_trees/navigate_to_pose_indoor_recovery.xml
    default_nav_through_poses_bt_xml: /home/robot/jackal_nav2/behavior_trees/navigate_through_poses_indoor_recovery.xml
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: platform/odom/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      # Reset the baseline/timer after >0.2 m displacement OR >0.35 rad yaw change.
      # Net pose change from baseline, not cumulative travel or goal progress.
      # Oscillation may also reset this checker; verify path convergence in the bag.
      required_movement_radius: 0.2
      required_movement_angle: 0.35
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # 114801 run succeeded at ~0.24 m with the old 0.25 m tolerance.
      # Next trial: require entry within 0.10 m; yaw tolerance is unchanged.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Keep the previous Shim: engage above ~20 deg, release below ~10 deg.
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.17
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.10
      max_angular_accel: 0.3
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: false
      closed_loop: true
      use_path_orientations: false
      # RPP tracks translation; the outer Shim handles heading and goal rotation.
      # Parameters of both plugins share this FollowPath namespace.
      use_rotate_to_heading: false
      allow_reversing: false
      desired_linear_vel: 0.06
      transform_tolerance: 0.1
      # Fixed lookahead avoids an extremely short carrot at very low speed.
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.6
      interpolate_curvature_after_goal: true
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.03
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      # Must match the local costmap inflation layer.
      inflation_cost_scaling_factor: 4.0
      use_collision_detection: true
      # Longer than 1 s for the low speed / 0.06 m costmap resolution.
      max_allowed_time_to_collision_up_to_carrot: 3.0
      max_robot_pose_search_dist: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.06
      footprint: '[[0.26, 0.22], [0.26, -0.22], [-0.26, -0.22], [-0.26, 0.22]]'
      footprint_padding: 0.02
      always_send_full_costmap: true
      plugins:
      - static_layer
      - voxel_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /j100_0949/sensors/lidar3d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[0.26, 0.22], [0.26, -0.22], [-0.26, -0.22], [-0.26, 0.22]]'
      footprint_padding: 0.02
      resolution: 0.06
      track_unknown_space: true
      always_send_full_costmap: true
      rolling_window: true
      width: 20
      height: 20
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /j100_0949/sensors/lidar3d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.1
    min_rotational_vel: 0.03
    rotational_acc_lim: 0.15
waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 50.0
    # Scale acceleration/deceleration deltas together; absolute limits remain per-axis.
    scale_velocities: true
    feedback: OPEN_LOOP
    # Bound the shared Nav2 output while permitting Shim's 0.10 rad/s turn.
    max_velocity:
    - 0.2
    - 0.0
    - 0.10
    min_velocity:
    - -0.1
    - 0.0
    - -0.10
    max_accel:
    - 0.3
    - 0.0
    - 0.3
    max_decel:
    - -0.3
    - 0.0
    - -0.3
    odom_topic: platform/odom/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 0.3
      simulation_time_step: 0.1
      min_points: 12
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /j100_0949/sensors/lidar3d_0/scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
